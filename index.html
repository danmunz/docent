<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frame Art Manager</title>
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text2: #888;
    --accent: #4a9eff;
    --accent-hover: #6bb3ff;
    --danger: #e55;
    --success: #4c6;
    --radius: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .tv-status {
    font-size: 13px;
    color: var(--text2);
  }

  .tv-status .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    background: var(--success);
  }

  .tv-status .dot.off { background: var(--danger); }

  button {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 8px 16px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    transition: background 0.15s, border-color 0.15s;
  }

  button:hover { background: #282828; border-color: #444; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: var(--accent-hover); }
  button.danger { border-color: var(--danger); color: var(--danger); }
  button.danger:hover { background: rgba(238,85,85,0.15); }
  button:disabled { opacity: 0.4; cursor: default; }

  select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 13px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .toolbar .spacer { flex: 1; }

  .selection-info {
    font-size: 13px;
    color: var(--text2);
  }

  .collection-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .collection-controls select { min-width: 140px; }

  .btn-icon {
    width: 32px;
    height: 32px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
  }

  /* Art grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
    padding: 24px 32px;
  }

  .art-card {
    position: relative;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
  }

  .art-card:hover { border-color: #444; transform: translateY(-2px); }
  .art-card.selected { border-color: var(--accent); }
  .art-card.current { border-color: var(--success); }

  .art-card .thumb {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    display: block;
    background: #111;
  }

  .art-card .thumb.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text2);
    font-size: 12px;
  }

  .art-card .info {
    padding: 10px 12px;
    font-size: 12px;
    color: var(--text2);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .art-card .current-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--success);
    color: #000;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 10px;
    text-transform: uppercase;
  }

  .art-card .aspect-badge {
    position: absolute;
    bottom: 36px;
    left: 6px;
    background: rgba(0,0,0,0.7);
    color: #ccc;
    font-size: 10px;
    font-weight: 500;
    padding: 1px 6px;
    border-radius: 3px;
  }

  .art-card .checkbox {
    position: absolute;
    top: 8px;
    left: 8px;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    border: 2px solid rgba(255,255,255,0.4);
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 14px;
  }

  .select-mode .art-card .checkbox { display: flex; }
  .art-card.selected .checkbox { background: var(--accent); border-color: var(--accent); }

  /* Upload drop zone */
  .upload-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 48px 24px;
    text-align: center;
    color: var(--text2);
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    margin: 24px 32px;
  }

  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: rgba(74,158,255,0.05);
  }

  .upload-zone h3 { color: var(--text); margin-bottom: 8px; font-size: 16px; }
  .upload-zone p { font-size: 13px; }

  .upload-zone input[type="file"] { display: none; }

  /* Upload preview */
  .upload-preview {
    display: none;
    margin: 0 32px 24px;
    padding: 16px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }

  .upload-preview.active { display: flex; gap: 20px; align-items: flex-start; }

  .upload-thumb-strip {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    max-width: 60%;
    padding: 4px 0;
    align-items: flex-start;
    flex-shrink: 0;
  }

  .upload-thumb-item {
    flex-shrink: 0;
    width: 80px;
    position: relative;
    text-align: center;
  }

  .upload-thumb-item img {
    width: 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 4px;
    background: #000;
  }

  .upload-thumb-item .thumb-name {
    font-size: 10px;
    color: var(--text2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 80px;
    margin-top: 2px;
  }

  .upload-thumb-item .thumb-remove {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--danger);
    color: #fff;
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    padding: 0;
    line-height: 1;
  }

  .compliance-badge {
    position: absolute;
    bottom: 20px;
    left: 2px;
    font-size: 9px;
    font-weight: 600;
    padding: 1px 5px;
    border-radius: 3px;
    white-space: nowrap;
    line-height: 1.4;
  }

  .compliance-ok {
    background: rgba(68, 204, 102, 0.85);
    color: #000;
  }

  .compliance-warn {
    background: rgba(255, 180, 0, 0.9);
    color: #000;
  }

  .upload-preview .upload-controls {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .upload-preview label {
    font-size: 13px;
    color: var(--text2);
  }

  .upload-matte-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .upload-progress {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: center;
    min-width: 250px;
  }

  .upload-progress .progress-label {
    font-size: 13px;
    color: var(--text);
  }

  .upload-progress .progress-sublabel {
    font-size: 11px;
    color: var(--text2);
  }

  .progress-bar-track {
    width: 100%;
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.15s;
    width: 0%;
  }

  /* Detail panel title */
  .detail-title-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }

  .detail-title-wrap h3 {
    margin-bottom: 0;
    cursor: pointer;
    border-bottom: 1px dashed transparent;
    transition: border-color 0.15s;
  }

  .detail-title-wrap h3:hover {
    border-bottom-color: var(--text2);
  }

  .detail-title-wrap .edit-icon {
    font-size: 14px;
    color: var(--text2);
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }

  .detail-title-wrap:hover .edit-icon {
    opacity: 1;
  }

  .detail-title-edit {
    display: none;
    gap: 6px;
    align-items: center;
    margin-bottom: 16px;
  }

  .detail-title-edit input {
    flex: 1;
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--accent);
    padding: 6px 10px;
    border-radius: var(--radius);
    font-size: 16px;
    font-weight: 600;
    outline: none;
  }

  /* Detail panel (matte chooser) */
  .detail-panel {
    display: none;
    position: fixed;
    top: 0; right: 0;
    width: 380px;
    height: 100vh;
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 24px;
    z-index: 100;
    overflow-y: auto;
  }

  .detail-panel.active { display: block; }

  .detail-panel h3 { margin-bottom: 16px; font-size: 16px; }

  .detail-panel .detail-info {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .detail-collections {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }

  .collection-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    background: rgba(74,158,255,0.15);
    color: var(--accent);
    border-radius: 12px;
    font-size: 11px;
  }

  .collection-badge .remove-badge {
    cursor: pointer;
    opacity: 0.6;
    font-size: 13px;
    line-height: 1;
  }

  .collection-badge .remove-badge:hover { opacity: 1; }

  .matte-section h4 {
    font-size: 13px;
    margin-bottom: 8px;
    color: var(--text2);
  }

  .matte-type-row {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }

  .matte-type-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
    background: var(--surface2);
    color: var(--text2);
    transition: border-color 0.15s, background 0.15s;
  }

  .matte-type-btn:hover { border-color: #555; }
  .matte-type-btn.active { border-color: var(--accent); color: var(--text); background: rgba(74,158,255,0.1); }

  .matte-color-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .color-swatch {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    cursor: pointer;
    transition: border-color 0.15s, transform 0.15s;
    position: relative;
  }

  .color-swatch:hover { transform: scale(1.1); }
  .color-swatch.active { border-color: var(--accent); border-width: 3px; }

  .color-swatch .swatch-label {
    position: absolute;
    bottom: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    color: var(--text2);
    white-space: nowrap;
  }

  .matte-preview-box {
    margin-bottom: 16px;
    border-radius: var(--radius);
    overflow: hidden;
    transition: all 0.2s;
    aspect-ratio: 16/9;
    background: #000;
  }

  .matte-preview-box img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
  }

  .detail-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .detail-close {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }

  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
  }

  .overlay.active { display: block; }

  /* Collection add dropdown */
  .collection-dropdown {
    position: relative;
    display: inline-block;
  }

  .collection-dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-width: 180px;
    z-index: 50;
    padding: 4px 0;
    margin-top: 4px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  .collection-dropdown-menu.open { display: block; }

  .collection-dropdown-item {
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    transition: background 0.1s;
  }

  .collection-dropdown-item:hover { background: var(--surface2); }

  .collection-dropdown-item.empty {
    color: var(--text2);
    font-style: italic;
    cursor: default;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 10px 20px;
    border-radius: var(--radius);
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Loading spinner */
  .spinner {
    display: inline-block;
    width: 16px;
    height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 300;
    flex-direction: column;
    gap: 12px;
    color: var(--text2);
    font-size: 14px;
  }

  .loading-overlay .spinner { width: 32px; height: 32px; border-width: 3px; }

  .empty-state {
    text-align: center;
    padding: 60px 32px;
    color: var(--text2);
  }

  .empty-state h3 { color: var(--text); margin-bottom: 8px; }

  .crop-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 2000;
    align-items: center;
    justify-content: center;
  }

  .crop-modal.active { display: flex; }

  .crop-modal-content {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    max-width: 700px;
    width: 95vw;
  }

  .crop-modal-content h3 {
    margin-bottom: 16px;
    font-size: 16px;
  }

  .crop-queue-indicator {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 8px;
  }

  .crop-canvas-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    border-radius: var(--radius);
    overflow: hidden;
    cursor: grab;
    margin-bottom: 16px;
  }

  .crop-canvas-wrap:active { cursor: grabbing; }

  .crop-canvas-wrap canvas {
    width: 100%;
    height: 100%;
    display: block;
  }

  .crop-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .crop-controls label {
    font-size: 13px;
    color: var(--text2);
  }

  .crop-controls input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }

  .crop-controls span {
    font-size: 13px;
    color: var(--text2);
    min-width: 40px;
  }

  .crop-info {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 16px;
  }

  .crop-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
</style>
</head>
<body>
  <header>
    <h1>Frame Art Manager</h1>
    <div class="header-controls">
      <span class="tv-status" id="tvStatus">Connecting...</span>
      <button id="btnArtMode" onclick="toggleArtMode()">Art Mode</button>
    </div>
  </header>

  <div class="upload-zone" id="uploadZone">
    <h3>Upload Artwork</h3>
    <p>Drag and drop images here, or click to browse</p>
    <input type="file" id="fileInput" accept="image/*" multiple>
  </div>

  <div class="upload-preview" id="uploadPreview">
    <div class="upload-thumb-strip" id="uploadThumbStrip"></div>
    <div class="upload-controls" id="uploadControls">
      <label>Matte Style</label>
      <div class="upload-matte-row">
        <select id="uploadMatte">
          <option value="none">None</option>
        </select>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="primary" onclick="doUpload()">Upload to Frame</button>
        <button onclick="cancelUpload()">Cancel</button>
      </div>
      <p id="uploadStatus" style="font-size:12px;color:var(--text2);margin-top:4px"></p>
    </div>
    <div class="upload-progress" id="uploadProgress" style="display:none"></div>
  </div>

  <div class="toolbar" id="toolbar">
    <div class="collection-controls">
      <select id="collectionFilter" onchange="filterByCollection(this.value)">
        <option value="">All Artwork</option>
      </select>
      <button class="btn-icon" onclick="createCollection()" title="New collection">+</button>
    </div>
    <button id="btnSelectMode" onclick="toggleSelectMode()">Select</button>
    <span class="selection-info" id="selectionInfo"></span>
    <div class="spacer"></div>
    <div class="collection-dropdown" id="addToCollectionDropdown" style="display:none">
      <button onclick="toggleCollectionDropdown()">Add to Collection</button>
      <div class="collection-dropdown-menu" id="collectionDropdownMenu"></div>
    </div>
    <button id="btnDeleteSelected" class="danger" style="display:none" onclick="deleteSelected()">Delete Selected</button>
    <button onclick="refreshArt()">Refresh</button>
  </div>

  <div class="grid" id="artGrid"></div>

  <div class="overlay" id="overlay" onclick="closeDetail()"></div>
  <div class="detail-panel" id="detailPanel">
    <button class="detail-close" onclick="closeDetail()">&times;</button>
    <div class="detail-title-wrap" id="detailTitleWrap">
      <h3 id="detailTitle" onclick="startRename()">Artwork Details</h3>
      <span class="edit-icon" onclick="startRename()">&#9998;</span>
    </div>
    <div class="detail-title-edit" id="detailTitleEdit">
      <input type="text" id="detailTitleInput" onkeydown="onRenameKeydown(event)">
      <button class="primary" onclick="saveRename()" style="padding:6px 10px">Save</button>
      <button onclick="cancelRename()" style="padding:6px 10px">Cancel</button>
    </div>
    <div class="matte-preview-box" id="mattePreviewBox">
      <img id="detailThumb" src="">
    </div>
    <div class="detail-info" id="detailInfo"></div>
    <div class="detail-collections" id="detailCollections"></div>
    <div class="matte-section">
      <h4>Frame Style</h4>
      <div class="matte-type-row" id="matteTypeRow"></div>
      <div class="matte-color-row" id="matteColorRow"></div>
    </div>
    <div class="detail-actions">
      <button class="primary" onclick="displayCurrent()">Display on Frame</button>
      <button class="danger" onclick="deleteCurrent()">Delete</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="crop-modal" id="cropModal">
    <div class="crop-modal-content">
      <div class="crop-queue-indicator" id="cropQueueIndicator"></div>
      <h3>Adjust Image &mdash; <span id="cropFileName"></span></h3>
      <div class="crop-canvas-wrap" id="cropCanvasWrap">
        <canvas id="cropCanvas"></canvas>
      </div>
      <div class="crop-controls">
        <label>Zoom</label>
        <input type="range" id="cropZoom" min="100" max="400" value="100" oninput="onCropZoom(this.value)">
        <span id="cropZoomLabel">100%</span>
      </div>
      <div class="crop-info" id="cropInfo"></div>
      <div class="crop-actions">
        <button class="primary" onclick="applyCrop()">Apply Crop</button>
        <button onclick="autoCrop()">Auto-fit</button>
        <button onclick="skipCropFile()">Skip (upload as-is)</button>
        <button onclick="removeCropFile()">Remove</button>
        <button onclick="closeCropModal()">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    let artItems = [];
    let currentId = null;
    let selectedIds = new Set();
    let selectMode = false;
    let detailItem = null;
    let artModeOn = false;
    let mattes = null;
    let pendingFiles = [];
    let pendingAnalysis = [];
    let collections = [];
    let activeCollectionId = null;
    const thumbCache = {};
    let artworkMeta = {};

    const MATTE_COLORS = {
      polar:    { bg: '#f5f0eb', border: '#e0d8ce', label: 'Polar' },
      warm:     { bg: '#f5ede0', border: '#e0d5c5', label: 'Warm' },
      sand:     { bg: '#d4c5a9', border: '#bfb08e', label: 'Sand' },
      neutral:  { bg: '#898886', border: '#7a7977', label: 'Neutral' },
      antique:  { bg: '#c4a882', border: '#b09570', label: 'Antique' },
      black:    { bg: '#222221', border: '#333',    label: 'Black' },
      navy:     { bg: '#1a2744', border: '#2a3754', label: 'Navy' },
      burgandy: { bg: '#5c1a2a', border: '#6c2a3a', label: 'Burgundy' },
      sage:     { bg: '#7a8c6e', border: '#6a7c5e', label: 'Sage' },
      apricot:  { bg: '#e8a87c', border: '#d89868', label: 'Apricot' },
      seafoam:  { bg: '#7fbfb0', border: '#6aafa0', label: 'Seafoam' },
    };

    const MATTE_TYPES = {
      none:       { padding: 0,  shadow: false, label: 'None' },
      shadowbox:  { padding: 16, shadow: true,  label: 'Shadow Box' },
      modernthin: { padding: 6,  shadow: false, label: 'Modern Thin' },
      modern:     { padding: 10, shadow: false, label: 'Modern' },
      modernwide: { padding: 20, shadow: false, label: 'Modern Wide' },
      flexible:   { padding: 12, shadow: false, label: 'Flexible' },
      panoramic:  { padding: 8,  shadow: false, label: 'Panoramic' },
    };

    let selectedMatteType = 'none';
    let selectedMatteColor = 'polar';

    // --- API helpers ---

    async function api(path, opts = {}) {
      const url = '/api' + path;
      const res = await fetch(url, {
        headers: opts.body instanceof FormData ? {} : { 'Content-Type': 'application/json' },
        ...opts,
        body: opts.body instanceof FormData ? opts.body : opts.body ? JSON.stringify(opts.body) : undefined,
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(err);
      }
      if (res.headers.get('content-type')?.includes('json')) return res.json();
      return res;
    }

    function toast(msg, duration = 3000) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), duration);
    }

    function showLoading(msg) {
      const el = document.createElement('div');
      el.className = 'loading-overlay';
      el.id = 'loadingOverlay';
      el.innerHTML = `<div class="spinner"></div><span>${msg}</span>`;
      document.body.appendChild(el);
    }

    function hideLoading() {
      document.getElementById('loadingOverlay')?.remove();
    }

    // --- Init ---

    async function init() {
      try {
        const info = await api('/info');
        artModeOn = info.artmode === 'on';
        updateArtModeButton();
        document.getElementById('tvStatus').innerHTML =
          `<span class="dot"></span>Connected — API v${info.api_version}`;
      } catch (e) {
        document.getElementById('tvStatus').innerHTML =
          `<span class="dot off"></span>TV offline`;
        toast('Cannot connect to TV: ' + e.message);
      }

      loadArt();
      loadMattes();
      loadCollections();
      loadArtworkMeta();
    }

    async function loadArtworkMeta() {
      try {
        const data = await api('/artwork-meta');
        artworkMeta = data.artwork || {};
      } catch {}
    }

    function getArtworkTitle(item) {
      const meta = artworkMeta[item.content_id];
      if (meta?.title) return meta.title;
      const category = item.category_id || '';
      return category.startsWith('MY-') ? 'My Photo' : (category || 'Unknown');
    }

    function getAspectLabel(ratio) {
      const common = [
        [16/9, '16:9'], [4/3, '4:3'], [3/2, '3:2'], [1, '1:1'],
        [5/4, '5:4'], [21/9, '21:9'], [9/16, '9:16'], [2/3, '2:3'], [3/4, '3:4'],
      ];
      for (const [r, label] of common) {
        if (Math.abs(ratio - r) < 0.02) return label;
      }
      return ratio > 1 ? ratio.toFixed(2) + ':1' : '1:' + (1/ratio).toFixed(2);
    }

    async function loadMattes() {
      try {
        mattes = await api('/mattes');
        populateUploadMatteSelect();
      } catch {
        populateUploadMatteSelect();
      }
    }

    // --- Art loading (cached) ---

    async function loadArt() {
      const grid = document.getElementById('artGrid');
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text2)"><div class="spinner"></div><br>Loading artwork...</div>';

      try {
        const data = await api('/art');
        artItems = data.items || [];
        currentId = data.current_id;
        if (data.stale) toast('Showing cached data — TV unreachable');
        renderGrid();
        loadThumbnails();
      } catch (e) {
        grid.innerHTML = `<div class="empty-state"><h3>Could not load artwork</h3><p>${e.message}</p></div>`;
      }
    }

    async function refreshArt() {
      const grid = document.getElementById('artGrid');
      try {
        const data = await api('/art/refresh', { method: 'POST' });
        artItems = data.items || [];
        currentId = data.current_id;
        const newCount = data.new_ids?.length || 0;
        const removedCount = data.removed_ids?.length || 0;
        renderGrid();
        if (newCount > 0) loadThumbnails();
        if (newCount || removedCount) {
          toast(`${newCount} new, ${removedCount} removed`);
        } else {
          toast('No changes');
        }
      } catch (e) {
        toast('Refresh failed: ' + e.message);
      }
    }

    function renderGrid() {
      const grid = document.getElementById('artGrid');
      const seen = new Set();
      let items = artItems.filter(a => {
        if (seen.has(a.content_id)) return false;
        seen.add(a.content_id);
        return true;
      });

      if (activeCollectionId) {
        const col = collections.find(c => c.id === activeCollectionId);
        if (col) {
          const colIds = new Set(col.content_ids);
          items = items.filter(a => colIds.has(a.content_id));
        }
      }

      if (!items.length) {
        const msg = activeCollectionId ? 'No artwork in this collection' : 'No artwork on Frame';
        const sub = activeCollectionId ? 'Add artwork via Select mode' : 'Upload some images to get started';
        grid.innerHTML = `<div class="empty-state"><h3>${msg}</h3><p>${sub}</p></div>`;
        return;
      }

      grid.innerHTML = items.map(item => {
        const id = item.content_id;
        const isCurrent = id === currentId;
        const isSelected = selectedIds.has(id);
        const title = getArtworkTitle(item);
        const cached = thumbCache[id];
        const meta = artworkMeta[id];
        let aspectBadge = '';
        if (meta && meta.width && meta.height) {
          const ar = meta.width / meta.height;
          if (Math.abs(ar - 16/9) > 0.01) {
            aspectBadge = `<span class="aspect-badge">${getAspectLabel(ar)}</span>`;
          }
        }
        return `
          <div class="art-card ${isSelected ? 'selected' : ''} ${isCurrent ? 'current' : ''}"
               data-id="${id}" onclick="onCardClick('${id}', event)">
            <div class="checkbox">${isSelected ? '&#10003;' : ''}</div>
            ${isCurrent ? '<span class="current-badge">Displayed</span>' : ''}
            ${aspectBadge}
            ${cached
              ? `<img class="thumb" id="thumb-${id}" src="${cached}">`
              : `<div class="thumb loading" id="thumb-${id}">Loading...</div>`}
            <div class="info">
              <span title="${title}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px">${title}</span>
              <span>${item.content_id?.substring(0, 8) || ''}</span>
            </div>
          </div>`;
      }).join('');
    }

    async function loadThumbnails() {
      const seen = new Set();
      const uncached = artItems.filter(a => {
        if (thumbCache[a.content_id] || seen.has(a.content_id)) return false;
        seen.add(a.content_id);
        return true;
      });
      if (!uncached.length) return;

      const BATCH = 10;
      for (let i = 0; i < uncached.length; i += BATCH) {
        const batch = uncached.slice(i, i + BATCH);
        const ids = batch.map(a => a.content_id);
        try {
          const data = await api('/thumbnails', {
            method: 'POST',
            body: { content_ids: ids },
          });
          for (const [name, b64] of Object.entries(data.thumbnails)) {
            const dataUrl = 'data:image/jpeg;base64,' + b64;
            const cid = ids.find(id => name.startsWith(id) || name === id);
            if (cid) {
              thumbCache[cid] = dataUrl;
              const el = document.getElementById('thumb-' + cid);
              if (el && el.classList?.contains('loading')) {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = dataUrl;
                img.id = 'thumb-' + cid;
                el.replaceWith(img);
              }
            }
          }
          // Sequential fallback for unmatched ids
          const thumbEntries = Object.entries(data.thumbnails);
          thumbEntries.forEach(([name, b64], idx) => {
            if (idx < ids.length && !thumbCache[ids[idx]]) {
              const dataUrl = 'data:image/jpeg;base64,' + b64;
              thumbCache[ids[idx]] = dataUrl;
              const el = document.getElementById('thumb-' + ids[idx]);
              if (el && el.classList?.contains('loading')) {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = dataUrl;
                img.id = 'thumb-' + ids[idx];
                el.replaceWith(img);
              }
            }
          });
        } catch {
          for (const id of ids) {
            if (!thumbCache[id]) {
              const el = document.getElementById('thumb-' + id);
              if (el && el.classList?.contains('loading')) {
                const img = document.createElement('img');
                img.className = 'thumb';
                img.src = '/api/thumbnail/' + id;
                img.id = 'thumb-' + id;
                el.replaceWith(img);
              }
            }
          }
        }
      }
      renderGrid();
    }

    // --- Card interactions ---

    function onCardClick(id, event) {
      if (selectMode) {
        event.preventDefault();
        if (selectedIds.has(id)) selectedIds.delete(id);
        else selectedIds.add(id);
        renderGrid();
        updateSelectionInfo();
        return;
      }
      openDetail(id);
    }

    function toggleSelectMode() {
      selectMode = !selectMode;
      selectedIds.clear();
      document.getElementById('artGrid').classList.toggle('select-mode', selectMode);
      document.getElementById('btnSelectMode').textContent = selectMode ? 'Cancel' : 'Select';
      document.getElementById('btnDeleteSelected').style.display = selectMode ? '' : 'none';
      document.getElementById('addToCollectionDropdown').style.display = selectMode ? '' : 'none';
      updateSelectionInfo();
      renderGrid();
    }

    function updateSelectionInfo() {
      const info = document.getElementById('selectionInfo');
      if (!selectMode) { info.textContent = ''; return; }
      info.textContent = selectedIds.size ? `${selectedIds.size} selected` : 'Click cards to select';
    }

    // --- Detail panel ---

    function openDetail(id) {
      detailItem = artItems.find(a => a.content_id === id);
      if (!detailItem) return;

      renderDetailTitle(detailItem);
      const thumbSrc = thumbCache[id] || document.getElementById('thumb-' + id)?.src || '';
      document.getElementById('detailThumb').src = thumbSrc;
      document.getElementById('detailInfo').innerHTML = `
        <div>ID: ${id}</div>
        <div>Category: ${detailItem.category_id || 'Unknown'}</div>
      `;

      renderDetailCollections(id);
      initMatteSelector(detailItem.matte_id);

      document.getElementById('detailPanel').classList.add('active');
      document.getElementById('overlay').classList.add('active');
    }

    function closeDetail() {
      document.getElementById('detailPanel').classList.remove('active');
      document.getElementById('overlay').classList.remove('active');
      detailItem = null;
    }

    function renderDetailTitle(item) {
      const title = getArtworkTitle(item);
      document.getElementById('detailTitle').textContent = title;
      document.getElementById('detailTitleWrap').style.display = '';
      document.getElementById('detailTitleEdit').style.display = 'none';
    }

    function startRename() {
      if (!detailItem) return;
      document.getElementById('detailTitleInput').value = getArtworkTitle(detailItem);
      document.getElementById('detailTitleWrap').style.display = 'none';
      document.getElementById('detailTitleEdit').style.display = 'flex';
      document.getElementById('detailTitleInput').focus();
      document.getElementById('detailTitleInput').select();
    }

    function cancelRename() {
      document.getElementById('detailTitleWrap').style.display = '';
      document.getElementById('detailTitleEdit').style.display = 'none';
    }

    function onRenameKeydown(e) {
      if (e.key === 'Enter') saveRename();
      if (e.key === 'Escape') cancelRename();
    }

    async function saveRename() {
      if (!detailItem) return;
      const newTitle = document.getElementById('detailTitleInput').value.trim();
      if (!newTitle) { toast('Title cannot be empty'); return; }
      try {
        await api(`/artwork-meta/${detailItem.content_id}`, {
          method: 'PUT',
          body: { title: newTitle },
        });
        artworkMeta[detailItem.content_id] = artworkMeta[detailItem.content_id] || {};
        artworkMeta[detailItem.content_id].title = newTitle;
        renderDetailTitle(detailItem);
        renderGrid();
        toast('Title updated');
      } catch (e) {
        toast('Failed: ' + e.message);
      }
    }

    function renderDetailCollections(contentId) {
      const container = document.getElementById('detailCollections');
      const memberOf = collections.filter(c => c.content_ids.includes(contentId));
      if (!memberOf.length) {
        container.innerHTML = '';
        return;
      }
      container.innerHTML = memberOf.map(c =>
        `<span class="collection-badge">${c.name}<span class="remove-badge" onclick="removeFromCollectionDetail('${c.id}', '${contentId}')">&times;</span></span>`
      ).join('');
    }

    // --- Matte selector (visual previews) ---

    function parseMatteId(matteId) {
      if (!matteId || matteId === 'none') return { type: 'none', color: 'polar' };
      const parts = matteId.split('_');
      const type = parts[0];
      const color = parts.slice(1).join('_');
      return { type: type || 'none', color: color || 'polar' };
    }

    function buildMatteId(type, color) {
      if (type === 'none') return 'none';
      return `${type}_${color}`;
    }

    function initMatteSelector(currentMatteId) {
      const parsed = parseMatteId(currentMatteId);
      selectedMatteType = parsed.type;
      selectedMatteColor = parsed.color;
      renderMatteTypeRow();
      renderMatteColorRow();
      updateMattePreview();
    }

    function renderMatteTypeRow() {
      const row = document.getElementById('matteTypeRow');
      const types = Object.entries(MATTE_TYPES);
      row.innerHTML = types.map(([id, t]) =>
        `<button class="matte-type-btn ${id === selectedMatteType ? 'active' : ''}" onclick="selectMatteType('${id}')">${t.label}</button>`
      ).join('');
    }

    function renderMatteColorRow() {
      const row = document.getElementById('matteColorRow');
      if (selectedMatteType === 'none') {
        row.innerHTML = '';
        return;
      }
      row.innerHTML = Object.entries(MATTE_COLORS).map(([id, c]) =>
        `<div class="color-swatch ${id === selectedMatteColor ? 'active' : ''}" style="background:${c.bg}" onclick="selectMatteColor('${id}')" title="${c.label}">
          <span class="swatch-label">${c.label}</span>
        </div>`
      ).join('');
    }

    function updateMattePreview() {
      const box = document.getElementById('mattePreviewBox');
      const type = MATTE_TYPES[selectedMatteType] || MATTE_TYPES.none;
      const color = MATTE_COLORS[selectedMatteColor] || MATTE_COLORS.polar;

      if (selectedMatteType === 'none') {
        box.style.padding = '0';
        box.style.background = 'transparent';
        box.style.boxShadow = 'none';
      } else {
        box.style.padding = type.padding + 'px';
        box.style.background = color.bg;
        box.style.boxShadow = type.shadow ? `inset 0 0 ${type.padding}px rgba(0,0,0,0.25)` : `inset 0 0 1px ${color.border}`;
      }
    }

    function selectMatteType(type) {
      selectedMatteType = type;
      renderMatteTypeRow();
      renderMatteColorRow();
      updateMattePreview();
      applyMatte();
    }

    function selectMatteColor(color) {
      selectedMatteColor = color;
      renderMatteColorRow();
      updateMattePreview();
      applyMatte();
    }

    let _matteDebounce = null;
    async function applyMatte() {
      if (!detailItem) return;
      clearTimeout(_matteDebounce);
      _matteDebounce = setTimeout(async () => {
        const matteId = buildMatteId(selectedMatteType, selectedMatteColor);
        try {
          await api('/matte', { method: 'POST', body: { content_id: detailItem.content_id, matte_id: matteId } });
          detailItem.matte_id = matteId;
          toast('Matte updated');
        } catch (e) {
          toast('Failed: ' + e.message);
        }
      }, 500);
    }

    // --- Upload matte select (dynamic) ---

    function populateUploadMatteSelect() {
      const sel = document.getElementById('uploadMatte');
      const types = Object.entries(MATTE_TYPES);
      const colors = Object.entries(MATTE_COLORS);

      let html = '<option value="none">No Matte</option>';
      for (const [typeId, type] of types) {
        if (typeId === 'none') continue;
        for (const [colorId, color] of colors) {
          const value = `${typeId}_${colorId}`;
          const selected = value === 'shadowbox_polar' ? ' selected' : '';
          html += `<option value="${value}"${selected}>${type.label} — ${color.label}</option>`;
        }
      }
      sel.innerHTML = html;
    }

    function updateUploadMattePreview() {
      // no-op: matte preview removed with single-image preview
    }

    // --- Actions ---

    async function displayCurrent() {
      if (!detailItem) return;
      try {
        showLoading('Setting display...');
        await api('/select', { method: 'POST', body: { content_id: detailItem.content_id } });
        currentId = detailItem.content_id;
        renderGrid();
        toast('Now displaying');
      } catch (e) {
        toast('Failed: ' + e.message);
      } finally {
        hideLoading();
      }
    }

    async function deleteCurrent() {
      if (!detailItem) return;
      if (!confirm('Delete this artwork from your Frame?')) return;
      try {
        showLoading('Deleting...');
        await api('/delete', { method: 'POST', body: { content_ids: [detailItem.content_id] } });
        delete thumbCache[detailItem.content_id];
        delete artworkMeta[detailItem.content_id];
        closeDetail();
        toast('Deleted');
        loadArt();
      } catch (e) {
        toast('Failed: ' + e.message);
      } finally {
        hideLoading();
      }
    }

    async function deleteSelected() {
      if (!selectedIds.size) return;
      if (!confirm(`Delete ${selectedIds.size} artwork(s)?`)) return;
      try {
        showLoading('Deleting...');
        await api('/delete', { method: 'POST', body: { content_ids: [...selectedIds] } });
        for (const id of selectedIds) delete thumbCache[id];
        for (const id of selectedIds) delete artworkMeta[id];
        selectedIds.clear();
        toggleSelectMode();
        toast('Deleted');
        loadArt();
      } catch (e) {
        toast('Failed: ' + e.message);
      } finally {
        hideLoading();
      }
    }

    // --- Art mode ---

    function updateArtModeButton() {
      const btn = document.getElementById('btnArtMode');
      btn.textContent = artModeOn ? 'Art Mode: ON' : 'Art Mode: OFF';
      btn.classList.toggle('primary', artModeOn);
    }

    async function toggleArtMode() {
      try {
        artModeOn = !artModeOn;
        await api('/artmode', { method: 'POST', body: { mode: artModeOn } });
        updateArtModeButton();
        toast(artModeOn ? 'Art mode on' : 'Art mode off');
      } catch (e) {
        artModeOn = !artModeOn;
        updateArtModeButton();
        toast('Failed: ' + e.message);
      }
    }

    // --- Collections ---

    async function loadCollections() {
      try {
        const data = await api('/collections');
        collections = data.collections || [];
        renderCollectionFilter();
      } catch {}
    }

    function renderCollectionFilter() {
      const sel = document.getElementById('collectionFilter');
      const prev = sel.value;
      sel.innerHTML = '<option value="">All Artwork</option>' +
        collections.map(c => `<option value="${c.id}">${c.name} (${c.content_ids.length})</option>`).join('');
      if (prev && collections.find(c => c.id === prev)) sel.value = prev;
    }

    function filterByCollection(id) {
      activeCollectionId = id || null;
      renderGrid();
    }

    async function createCollection() {
      const name = prompt('Collection name:');
      if (!name?.trim()) return;
      try {
        await api('/collections', { method: 'POST', body: { name: name.trim() } });
        await loadCollections();
        toast('Collection created');
      } catch (e) {
        toast('Failed: ' + e.message);
      }
    }

    function toggleCollectionDropdown() {
      const menu = document.getElementById('collectionDropdownMenu');
      const isOpen = menu.classList.contains('open');

      if (isOpen) {
        menu.classList.remove('open');
        return;
      }

      if (!collections.length) {
        menu.innerHTML = '<div class="collection-dropdown-item empty">No collections yet</div>';
      } else {
        menu.innerHTML = collections.map(c =>
          `<div class="collection-dropdown-item" onclick="addSelectedToCollection('${c.id}')">${c.name}</div>`
        ).join('');
      }
      menu.classList.add('open');
    }

    async function addSelectedToCollection(collectionId) {
      document.getElementById('collectionDropdownMenu').classList.remove('open');
      if (!selectedIds.size) return;
      try {
        await api(`/collections/${collectionId}/items`, {
          method: 'POST',
          body: { content_ids: [...selectedIds] },
        });
        await loadCollections();
        toast(`Added ${selectedIds.size} item(s) to collection`);
      } catch (e) {
        toast('Failed: ' + e.message);
      }
    }

    async function removeFromCollectionDetail(collectionId, contentId) {
      try {
        await api(`/collections/${collectionId}/items`, {
          method: 'DELETE',
          body: { content_ids: [contentId] },
        });
        await loadCollections();
        renderDetailCollections(contentId);
        if (activeCollectionId) renderGrid();
        toast('Removed from collection');
      } catch (e) {
        toast('Failed: ' + e.message);
      }
    }

    // --- Upload ---

    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    function handleFiles(files) {
      if (!files.length) return;
      pendingFiles = [...files];
      pendingAnalysis = new Array(pendingFiles.length).fill(null);
      renderPendingFiles();
      pendingFiles.forEach((file, idx) => {
        analyzeImage(file).then(analysis => {
          pendingAnalysis[idx] = analysis;
          const badge = document.getElementById('compBadge_' + idx);
          if (badge) {
            badge.innerHTML = getComplianceBadgeHTML(analysis);
            badge.className = 'compliance-badge ' + (analysis.compliant ? 'compliance-ok' : 'compliance-warn');
          }
        });
      });
    }

    function analyzeImage(file) {
      return new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const w = img.naturalWidth, h = img.naturalHeight;
          const aspect = w / h;
          const target = 16 / 9;
          const issues = [];
          if (Math.abs(aspect - target) > 0.01) issues.push('not-16:9');
          if (w < 3840 || h < 2160) issues.push('low-res');
          if (w > 3840) issues.push('oversized');
          resolve({ width: w, height: h, aspect, compliant: issues.length === 0, issues });
          URL.revokeObjectURL(img.src);
        };
        img.onerror = () => resolve({ width: 0, height: 0, aspect: 0, compliant: false, issues: ['unreadable'] });
        img.src = URL.createObjectURL(file);
      });
    }

    function getComplianceBadgeHTML(analysis) {
      if (analysis.compliant) return '\u2713';
      const labels = [];
      if (analysis.issues.includes('not-16:9')) labels.push('Not 16:9');
      if (analysis.issues.includes('low-res')) labels.push('Low res');
      if (analysis.issues.includes('oversized')) labels.push('Large');
      return '\u26A0 ' + labels.join(', ');
    }

    // --- Crop Editor ---
    let cropState = { file: null, img: null, zoom: 1, offsetX: 0, offsetY: 0, dragging: false, dragStartX: 0, dragStartY: 0, fileIndex: -1 };
    let cropQueue = [];
    let cropQueueIndex = 0;
    let cropResolve = null;

    function openCropModal(fileIndex) {
      const file = pendingFiles[fileIndex];
      if (!file) return;
      cropState.fileIndex = fileIndex;
      cropState.file = file;
      cropState.zoom = 1;
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      document.getElementById('cropFileName').textContent = file.name;
      const img = new Image();
      img.onload = () => {
        cropState.img = img;
        autoCrop();
        document.getElementById('cropModal').classList.add('active');
        requestAnimationFrame(() => {
          setupCropCanvas();
          drawCropCanvas();
          updateCropInfo();
        });
      };
      img.src = URL.createObjectURL(file);
    }

    function closeCropModal() {
      document.getElementById('cropModal').classList.remove('active');
      if (cropState.img) URL.revokeObjectURL(cropState.img.src);
      cropState.img = null;
      if (cropResolve) { cropResolve('cancel'); cropResolve = null; }
    }

    function setupCropCanvas() {
      const canvas = document.getElementById('cropCanvas');
      const wrap = document.getElementById('cropCanvasWrap');
      canvas.width = wrap.clientWidth * (window.devicePixelRatio || 1);
      canvas.height = Math.round(canvas.width * 9 / 16);

      canvas.onmousedown = e => { cropState.dragging = true; cropState.dragStartX = e.clientX; cropState.dragStartY = e.clientY; };
      canvas.onmousemove = e => {
        if (!cropState.dragging) return;
        const scale = getCropScale();
        cropState.offsetX += (e.clientX - cropState.dragStartX) / scale;
        cropState.offsetY += (e.clientY - cropState.dragStartY) / scale;
        cropState.dragStartX = e.clientX;
        cropState.dragStartY = e.clientY;
        clampOffsets();
        drawCropCanvas();
      };
      canvas.onmouseup = canvas.onmouseleave = () => { cropState.dragging = false; };

      canvas.ontouchstart = e => { e.preventDefault(); const t = e.touches[0]; cropState.dragging = true; cropState.dragStartX = t.clientX; cropState.dragStartY = t.clientY; };
      canvas.ontouchmove = e => {
        if (!cropState.dragging) return;
        const t = e.touches[0]; const scale = getCropScale();
        cropState.offsetX += (t.clientX - cropState.dragStartX) / scale;
        cropState.offsetY += (t.clientY - cropState.dragStartY) / scale;
        cropState.dragStartX = t.clientX;
        cropState.dragStartY = t.clientY;
        clampOffsets();
        drawCropCanvas();
      };
      canvas.ontouchend = () => { cropState.dragging = false; };

      document.getElementById('cropZoom').value = Math.round(cropState.zoom * 100);
      document.getElementById('cropZoomLabel').textContent = Math.round(cropState.zoom * 100) + '%';
    }

    function getCropScale() {
      const canvas = document.getElementById('cropCanvas');
      const wrap = document.getElementById('cropCanvasWrap');
      return canvas.width / wrap.clientWidth;
    }

    function clampOffsets() {
      const img = cropState.img;
      if (!img) return;
      const canvas = document.getElementById('cropCanvas');
      const viewW = canvas.width, viewH = canvas.height;
      const scaledW = img.naturalWidth * cropState.zoom;
      const scaledH = img.naturalHeight * cropState.zoom;
      const fitScale = Math.max(viewW / scaledW, viewH / scaledH);
      const drawW = scaledW * fitScale, drawH = scaledH * fitScale;
      const maxX = Math.max(0, (drawW - viewW) / 2 / fitScale / cropState.zoom);
      const maxY = Math.max(0, (drawH - viewH) / 2 / fitScale / cropState.zoom);
      cropState.offsetX = Math.max(-maxX, Math.min(maxX, cropState.offsetX));
      cropState.offsetY = Math.max(-maxY, Math.min(maxY, cropState.offsetY));
    }

    function drawCropCanvas() {
      const canvas = document.getElementById('cropCanvas');
      const ctx = canvas.getContext('2d');
      const img = cropState.img;
      if (!img) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const viewW = canvas.width, viewH = canvas.height;
      const scaledW = img.naturalWidth * cropState.zoom;
      const scaledH = img.naturalHeight * cropState.zoom;
      const fitScale = Math.max(viewW / scaledW, viewH / scaledH);
      const drawW = scaledW * fitScale, drawH = scaledH * fitScale;
      const dx = (viewW - drawW) / 2 + cropState.offsetX * fitScale * cropState.zoom;
      const dy = (viewH - drawH) / 2 + cropState.offsetY * fitScale * cropState.zoom;
      ctx.drawImage(img, dx, dy, drawW, drawH);
    }

    function onCropZoom(val) {
      cropState.zoom = val / 100;
      document.getElementById('cropZoomLabel').textContent = val + '%';
      clampOffsets();
      drawCropCanvas();
      updateCropInfo();
    }

    function autoCrop() {
      const img = cropState.img;
      if (!img) return;
      const imgAspect = img.naturalWidth / img.naturalHeight;
      const targetAspect = 16 / 9;
      if (imgAspect > targetAspect) {
        cropState.zoom = 1;
      } else {
        cropState.zoom = targetAspect / imgAspect;
      }
      cropState.offsetX = 0;
      cropState.offsetY = 0;
      const slider = document.getElementById('cropZoom');
      if (slider) {
        slider.value = Math.round(cropState.zoom * 100);
        document.getElementById('cropZoomLabel').textContent = Math.round(cropState.zoom * 100) + '%';
      }
      clampOffsets();
      drawCropCanvas();
      updateCropInfo();
    }

    function updateCropInfo() {
      const img = cropState.img;
      if (!img) return;
      const info = document.getElementById('cropInfo');
      info.textContent = `Source: ${img.naturalWidth}\u00d7${img.naturalHeight} \u2022 Output: 3840\u00d72160 (16:9)`;
    }

    function applyCrop() {
      const img = cropState.img;
      if (!img) return;
      const outW = 3840, outH = 2160;
      const viewCanvas = document.getElementById('cropCanvas');
      const viewW = viewCanvas.width, viewH = viewCanvas.height;
      const scaledW = img.naturalWidth * cropState.zoom;
      const scaledH = img.naturalHeight * cropState.zoom;
      const fitScale = Math.max(viewW / scaledW, viewH / scaledH);
      const drawW = scaledW * fitScale, drawH = scaledH * fitScale;
      const dx = (viewW - drawW) / 2 + cropState.offsetX * fitScale * cropState.zoom;
      const dy = (viewH - drawH) / 2 + cropState.offsetY * fitScale * cropState.zoom;
      const srcX = -dx / drawW * img.naturalWidth;
      const srcY = -dy / drawH * img.naturalHeight;
      const srcW = viewW / drawW * img.naturalWidth;
      const srcH = viewH / drawH * img.naturalHeight;

      const offscreen = document.createElement('canvas');
      offscreen.width = outW;
      offscreen.height = outH;
      const ctx = offscreen.getContext('2d');
      ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, outW, outH);
      offscreen.toBlob(blob => {
        if (!blob) { toast('Crop failed'); return; }
        const name = cropState.file.name.replace(/\.[^.]+$/, '') + '_cropped.jpg';
        const croppedFile = new File([blob], name, { type: 'image/jpeg' });
        pendingFiles[cropState.fileIndex] = croppedFile;
        pendingAnalysis[cropState.fileIndex] = { width: outW, height: outH, aspect: 16/9, compliant: true, issues: [] };
        renderPendingFiles();
        document.getElementById('cropModal').classList.remove('active');
        if (cropResolve) { cropResolve('cropped'); cropResolve = null; }
        else advanceCropQueue();
      }, 'image/jpeg', 0.95);
    }

    function skipCropFile() {
      document.getElementById('cropModal').classList.remove('active');
      if (cropResolve) { cropResolve('skip'); cropResolve = null; }
      else advanceCropQueue();
    }

    function removeCropFile() {
      const idx = cropState.fileIndex;
      document.getElementById('cropModal').classList.remove('active');
      pendingFiles.splice(idx, 1);
      pendingAnalysis.splice(idx, 1);
      cropQueue = cropQueue.filter(i => i !== idx).map(i => i > idx ? i - 1 : i);
      cropQueueIndex = Math.min(cropQueueIndex, cropQueue.length);
      if (!pendingFiles.length) { cancelUpload(); return; }
      renderPendingFiles();
      if (cropResolve) { cropResolve('removed'); cropResolve = null; }
      else advanceCropQueue();
    }

    function advanceCropQueue() {
      cropQueueIndex++;
      if (cropQueueIndex < cropQueue.length) {
        updateQueueIndicator();
        openCropModal(cropQueue[cropQueueIndex]);
      } else {
        doFinalUpload();
      }
    }

    function updateQueueIndicator() {
      const el = document.getElementById('cropQueueIndicator');
      if (cropQueue.length > 1) {
        el.textContent = `Image ${cropQueueIndex + 1} of ${cropQueue.length} needing adjustment`;
      } else {
        el.textContent = '';
      }
    }

    function renderPendingFiles() {
      const strip = document.getElementById('uploadThumbStrip');
      strip.innerHTML = '';
      pendingFiles.forEach((file, idx) => {
        const reader = new FileReader();
        reader.onload = e => {
          const item = document.createElement('div');
          item.className = 'upload-thumb-item';
          const a = pendingAnalysis[idx];
          const badgeClass = a ? ('compliance-badge ' + (a.compliant ? 'compliance-ok' : 'compliance-warn')) : 'compliance-badge';
          const badgeHTML = a ? getComplianceBadgeHTML(a) : '';
          item.innerHTML = `
            <button class="thumb-remove" onclick="removePendingFile(${idx})">&times;</button>
            <img src="${e.target.result}">
            <span class="${badgeClass}" id="compBadge_${idx}">${badgeHTML}</span>
            <div class="thumb-name" title="${file.name}">${file.name}</div>
          `;
          strip.appendChild(item);
        };
        reader.readAsDataURL(file);
      });
      document.getElementById('uploadPreview').classList.add('active');
      document.getElementById('uploadStatus').textContent =
        `${pendingFiles.length} file${pendingFiles.length > 1 ? 's' : ''} selected`;
    }

    function removePendingFile(idx) {
      pendingFiles.splice(idx, 1);
      pendingAnalysis.splice(idx, 1);
      if (!pendingFiles.length) { cancelUpload(); return; }
      renderPendingFiles();
    }

    function cancelUpload() {
      pendingFiles = [];
      pendingAnalysis = [];
      document.getElementById('uploadPreview').classList.remove('active');
      document.getElementById('uploadThumbStrip').style.display = '';
      document.getElementById('uploadControls').style.display = '';
      document.getElementById('uploadProgress').style.display = 'none';
      fileInput.value = '';
    }

    function uploadFileWithProgress(file, matte, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        const form = new FormData();
        form.append('file', file);
        form.append('matte', matte);
        form.append('filename', file.name);

        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) onProgress((e.loaded / e.total) * 100);
        };

        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) {
            try { resolve(JSON.parse(xhr.responseText)); }
            catch { resolve({}); }
          } else {
            reject(new Error(xhr.statusText || 'Upload failed'));
          }
        };

        xhr.onerror = () => reject(new Error('Network error'));
        xhr.open('POST', '/api/upload');
        xhr.send(form);
      });
    }

    async function doUpload() {
      if (!pendingFiles.length) return;

      // Wait for all analysis to complete
      const waitStart = Date.now();
      while (pendingAnalysis.some(a => a === null) && Date.now() - waitStart < 5000) {
        await new Promise(r => setTimeout(r, 50));
      }

      const nonCompliant = [];
      for (let i = 0; i < pendingFiles.length; i++) {
        const a = pendingAnalysis[i];
        if (a && !a.compliant && a.issues.includes('not-16:9')) {
          nonCompliant.push(i);
        }
      }

      if (nonCompliant.length > 0) {
        cropQueue = nonCompliant;
        cropQueueIndex = 0;
        updateQueueIndicator();
        openCropModal(cropQueue[0]);
        return;
      }

      doFinalUpload();
    }

    async function doFinalUpload() {
      if (!pendingFiles.length) { cancelUpload(); return; }
      const matte = document.getElementById('uploadMatte').value;

      document.getElementById('uploadThumbStrip').style.display = 'none';
      document.getElementById('uploadControls').style.display = 'none';
      const progressDiv = document.getElementById('uploadProgress');
      progressDiv.style.display = 'flex';
      progressDiv.innerHTML = `
        <div class="progress-label" id="progressLabel">Preparing upload...</div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="progress-sublabel" id="progressSublabel"></div>
        <button onclick="cancelUpload()">Cancel</button>
      `;

      let uploaded = 0;
      const total = pendingFiles.length;

      for (const file of pendingFiles) {
        document.getElementById('progressLabel').textContent =
          `Uploading ${uploaded + 1} of ${total}: ${file.name}`;
        document.getElementById('progressBar').style.width = '0%';

        try {
          const result = await uploadFileWithProgress(file, matte, (pct) => {
            document.getElementById('progressBar').style.width = pct + '%';
            document.getElementById('progressSublabel').textContent = Math.round(pct) + '%';
          });
          uploaded++;
          if (result.content_id && result.title) {
            artworkMeta[result.content_id] = { title: result.title, width: result.width, height: result.height };
          }
        } catch (e) {
          toast(`Failed to upload ${file.name}: ${e.message}`);
        }
      }

      cancelUpload();
      toast(`Uploaded ${uploaded} file(s)`);
      loadArt();
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', e => {
      const dd = document.getElementById('addToCollectionDropdown');
      if (!dd.contains(e.target)) {
        document.getElementById('collectionDropdownMenu').classList.remove('open');
      }
    });

    // --- Start ---
    init();
  </script>
</body>
</html>
