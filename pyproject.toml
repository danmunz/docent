[project]
name = "frame-art-manager"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "samsungtvws @ git+https://github.com/xchwarze/samsung-tv-ws-api.git",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "httpx>=0.27",
]

[project.scripts]
frame-art-manager = "server:main"
